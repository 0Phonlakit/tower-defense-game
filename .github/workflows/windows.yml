# Builds the Windows installer, installs it on a real Windows machine and starts the game once (smoke test).
# On a v* tag the installer is also attached to a GitHub Release.
name: Windows installer

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Install silently and start the game
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Rogue-Tower-Defense-Setup-*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Rogue Tower Defense.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installed game not found' }
          Write-Host "Installed at $($exe.FullName)"
          $run = Start-Process $exe.FullName -ArgumentList "--smoke=$PWD\smoke" -Wait -PassThru
          Get-Content smoke\result.json
          exit $run.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: Rogue-Tower-Defense-Setup
          path: dist/Rogue-Tower-Defense-Setup-*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rogue-Tower-Defense-Setup-*.exe
